name: Instagram — Nou taller

on:
  workflow_run:
    workflows: ["Deploy → Producció"]
    types: [completed]
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Instal·la pyyaml
        run: pip install pyyaml --quiet

      - name: Detecta i envia tallers nous
        env:
          MAKECOM_WEBHOOK: ${{ secrets.MAKECOM_INSTAGRAM_TALLER_WEBHOOK }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, urllib.request, subprocess
          import yaml

          webhook_url = os.environ.get('MAKECOM_WEBHOOK', '')
          if not webhook_url:
              print("MAKECOM_INSTAGRAM_TALLER_WEBHOOK no configurat. Saltant.")
              exit(0)

          result = subprocess.run(
              ['git', 'diff', '--name-only', '--diff-filter=A', 'HEAD~1', 'HEAD'],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              print(f"Error executant git diff: {result.stderr}")
              exit(1)
          all_new = result.stdout.strip().split('\n') if result.stdout.strip() else []
          taller_files = [
              f for f in all_new
              if re.match(r'content/ca/tallers/[^/]+/index\.md$', f)
          ]

          if not taller_files:
              print("Cap taller nou detectat.")
              exit(0)

          def abs_url(path):
              if not path:
                  return ''
              return f"https://llumatics.com/{path.lstrip('/')}"

          for filepath in taller_files:
              if not os.path.exists(filepath):
                  continue

              with open(filepath, encoding='utf-8') as f:
                  content = f.read()

              match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
              if not match:
                  print(f"No s'ha trobat frontmatter a {filepath}")
                  continue

              fm = yaml.safe_load(match.group(1))

              if fm.get('draft', True):
                  print(f"Saltat (draft): {filepath}")
                  continue
              if fm.get('estat') != 'actiu':
                  print(f"Saltat (estat={fm.get('estat')}): {filepath}")
                  continue

              slug = filepath.split('/')[3]
              images = fm.get('images', [])

              payload = {
                  'slug': slug,
                  'title': fm.get('title', ''),
                  'lead': fm.get('lead', ''),
                  'image': abs_url(fm.get('image', '')),
                  'image_1': abs_url(images[0]) if images else abs_url(fm.get('image', '')),
                  'image_2': abs_url(images[1]) if len(images) > 1 else abs_url(fm.get('image', '')),
                  'durada_hores': fm.get('durada_hores', ''),
                  'max_places': fm.get('max_places', 4),
                  'lloc': fm.get('lloc', 'Nau Bostik, La Sagrera, Barcelona'),
                  'blocs': fm.get('blocs', []),
                  'sota_demanda': fm.get('sota_demanda', True),
                  'canal': fm.get('canal', 'llumatics'),
                  'url': f"https://llumatics.com/tallers/{slug}/",
              }

              data = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  webhook_url, data=data,
                  headers={'Content-Type': 'application/json'}
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      print(f"Webhook enviat per: {slug} — HTTP {resp.status}")
              except Exception as e:
                  print(f"Error enviant webhook per {slug}: {e}")
                  exit(1)
          PYEOF
