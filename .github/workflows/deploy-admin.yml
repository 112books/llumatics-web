name: Deploy admin (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup i puja els fitxers admin
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          STAMP=$(date -u +%Y%m%d%H%M%S)
          $SSH "cd www/admin && cp index.html index.html.bak-$STAMP && cp fetch-analytics.php fetch-analytics.php.bak-$STAMP" || true
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no static/admin/index.html ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:www/admin/index.html
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no static/admin/fetch-analytics.php ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:www/admin/fetch-analytics.php
