name: Deploy → Producció

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.159.0'
          extended: true

      - name: Build Hugo (producció)
        run: hugo --minify --baseURL "https://llumatics.com/"

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H vl28359.dinaserver.com >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -az --delete --stats \
            --exclude='admin/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            public/ \
            llumatics@vl28359.dinaserver.com:www/
