{{ define "main" }}
<div class="section container">
  <div class="gracies-page">

    <div class="gracies-page__icon" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>

    <h1 class="gracies-page__title" id="gracies-title">{{ .Title }}</h1>
    <p class="gracies-page__msg" id="gracies-msg"></p>

    <div class="gracies-page__actions">
      <a href="{{ "/" | relLangURL }}" class="btn btn--secondary">{{ i18n "home" | default "Inici" }}</a>
      <a href="{{ "/tallers/" | relLangURL }}" class="btn btn--outline">{{ i18n "nav_courses" | default "Tallers" }}</a>
    </div>

  </div>
</div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var from   = params.get('from');
  var msg    = document.getElementById('gracies-msg');

  var messages = {
    contacte:   {{ i18n "gracies_msg_contacte"   | default "Hem rebut el teu missatge. T'escriurem en un màxim de 48 hores en dies feiners." | jsonify }},
    newsletter: {{ i18n "gracies_msg_newsletter"  | default "Ja ets a la llista. T'escriurem quan hi hagi novetats que valguin la pena." | jsonify }},
  };

  msg.textContent = messages[from] || {{ i18n "gracies_msg_default" | default "Tot ha anat bé. Gràcies per contactar amb Llumàtics." | jsonify }};
})();
</script>
{{ end }}
