{{/* Partial: newsletter.html
     Si hi ha un ID de Tally configurat, mostra l'embed.
     Si no, mostra un formulari natiu mínim.
*/}}
<section class="newsletter-block">
  <div class="container">
    <h2 class="newsletter-block__title">
      {{ i18n "newsletter_title" }}
    </h2>
    <p class="newsletter-block__desc">
      {{ i18n "newsletter_desc" }}
    </p>

    <form class="newsletter-form" data-subscribe-form data-ok="{{ i18n "newsletter_ok" }}" style="max-width:480px; margin-inline:auto;">
      <input type="text" name="website" value="" tabindex="-1" autocomplete="off" style="display:none;" aria-hidden="true">
      <input type="email" name="email" required autocomplete="email"
             placeholder="{{ i18n "newsletter_placeholder" }}"
             aria-label="{{ i18n "newsletter_placeholder" }}"
             class="newsletter-form__input">
      <button type="submit" class="btn btn--accent">{{ i18n "newsletter_cta" }}</button>
    </form>
  </div>
</section>
